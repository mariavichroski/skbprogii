<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Manobras - Skate na Base</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container mt-4">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#manobraModal">
      Crie uma manobra
    </button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="manobraModal" tabindex="-1" aria-labelledby="manobraModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="manobraModalLabel">Manobra</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label for="nomeManobra" class="form-label">Nome da manobra</label>
            <input type="text" id="nomeManobra" class="form-control">
          </div>

          <div class="mb-3">
            <label for="nivelDeManobra" class="form-label">Nível da manobra</label>
            <select class="form-control" id="nivelDeManobra">
              <option>Fácil</option>
              <option>Médio</option>
              <option>Intermediário</option>
              <option>Avançado</option>
            </select>
          </div>

          <div id="mensagem-erro" class="mt-3 text-danger text-center"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary">Salvar</button>
        </div>

      </div>
    </div>
  </div>

  <script src="libs/jquery.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
