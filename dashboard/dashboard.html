<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Skate na Base</title>
  <link href="https:/cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
  rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand"><img src="C:\Users\maria\Desktop\skate na base logo.png" alt= "logoTipo"></span>
    <button id="btnLogout" class="btn btn-outline-light">Sair</button>
  </div>
</nav>

<div class="container mt-4">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card text-bg-primary">
        <div class="card-body">
          <h5 class="card-title">Alunos Cadastrados</h5>
          <p class="card-text fs-4" id="total-alunos">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-bg-success">
        <div class="card-body">
          <h5 class="card-title">Manobras Registradas</h5>
          <p class="card-text fs-4" id="total-manobras">0</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-bg-warning">
        <div class="card-body">
          <h5 class="card-title">Eventos Criados</h5>
          <p class="card-text fs-4" id="total-eventos">0</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="libs/jquery.min.js"></script>
<script src="libs/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
